# SPDX-License-Identifier: AGPL-3.0-or-later
name: Build Desktop Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel (stable or canary)"
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - canary
      build_version:
        description: "Explicit build version (e.g. 1.0.0 or CalVer). If omitted, derived from the release tag."
        required: false
        default: ""
        type: string

concurrency:
  group: desktop-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build-desktop:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            arch: x64
            electron_arch: x64
          - platform: windows
            os: windows-latest
            arch: x64
            electron_arch: x64
          - platform: macos
            os: macos-latest
            arch: universal
            electron_arch: universal

    env:
      CHANNEL: ${{ inputs.channel || 'stable' }}
      BUILD_CHANNEL: ${{ inputs.channel || 'stable' }}
      RELEASE_CHANNEL: ${{ inputs.channel || 'stable' }}
      PUBLIC_RELEASE_CHANNEL: ${{ inputs.channel || 'stable' }}
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      ELECTRON_ARCH: ${{ matrix.electron_arch }}
      DESKTOP_PLATFORM: ${{ matrix.platform }}
      DESKTOP_ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: resolve-version
        shell: bash
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ inputs.build_version }}"
          TAG_VERSION="${{ github.event.release.tag_name || github.ref_name }}"
          CLEAN_VERSION="${INPUT_VERSION:-$TAG_VERSION}"
          CLEAN_VERSION="${CLEAN_VERSION#v}"
          CLEAN_VERSION="${CLEAN_VERSION#fluxer-desktop-stable@}"
          CLEAN_VERSION="${CLEAN_VERSION#fluxer-desktop-canary@}"
          echo "VERSION=${CLEAN_VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=${CLEAN_VERSION}" >> "$GITHUB_ENV"
          echo "PUBLIC_BUILD_VERSION=${CLEAN_VERSION}" >> "$GITHUB_ENV"
          echo "Resolved version: ${CLEAN_VERSION}"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'pnpm'

      # Linux-specific build steps (Debian .deb, RedHat .rpm, AppImage)
      - name: Install Linux build and packaging dependencies (deb & rpm tools)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm \
            fpm \
            desktop-file-utils \
            ruby \
            ruby-dev \
            build-essential \
            libx11-dev \
            libxtst-dev \
            libxinerama-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libudev-dev \
            pkg-config || true
          tools/ci/run.sh build-desktop --step install_linux_deps || true

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron main process
        working-directory: fluxer_desktop
        env:
          NODE_ENV: production
          FLUXER_DESKTOP_PRODUCTION: "true"
        run: pnpm build

      # --- Linux Build ---
      - name: Package Linux executables (deb, rpm, AppImage, tar.gz)
        if: matrix.platform == 'linux'
        working-directory: fluxer_desktop
        env:
          USE_SYSTEM_FPM: "true"
        run: |
          tools/ci/run.sh build-desktop --step build_app_linux || \
          pnpm exec electron-builder --config electron-builder.config.cjs --linux --${{ matrix.electron_arch }}

      - name: Prepare Linux artifacts & generate checksums
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p upload_staging
          # Copy outputs from dist-electron
          find fluxer_desktop/dist-electron -maxdepth 1 -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.tar.gz" \) -exec cp -v {} upload_staging/ \;
          cd upload_staging
          for f in *; do
            [ -f "$f" ] && sha256sum "$f" > "${f}.sha256"
          done
          ls -la

      # --- Windows Build ---
      - name: Package Windows app
        if: matrix.platform == 'windows'
        working-directory: fluxer_desktop
        shell: bash
        run: |
          tools/ci/run.sh build-desktop --step build_app_windows || \
          pnpm exec electron-builder --config electron-builder.config.cjs --win --${{ matrix.electron_arch }}
          tools/ci/run.sh build-desktop --step create_portable_zip_windows || true

      - name: Prepare Windows artifacts & generate checksums
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p upload_staging
          find fluxer_desktop/dist-electron -maxdepth 2 -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.nupkg" \) -exec cp -v {} upload_staging/ \; || true
          cd upload_staging
          for f in *; do
            [ -f "$f" ] && sha256sum "$f" > "${f}.sha256"
          done
          ls -la

      # --- macOS Build ---
      - name: Package macOS application (dmg, zip)
        if: matrix.platform == 'macos'
        working-directory: fluxer_desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm exec electron-builder --config electron-builder.config.cjs --mac --${{ matrix.electron_arch }}

      - name: Prepare macOS artifacts & generate checksums
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p upload_staging
          find fluxer_desktop/dist-electron -maxdepth 1 -type f \( -name "*.dmg" -o -name "*.zip" \) -exec cp -v {} upload_staging/ \;
          cd upload_staging
          for f in *; do
            [ -f "$f" ] && sha256sum "$f" > "${f}.sha256"
          done
          ls -la

      # --- Upload Staged Artifacts Directly to Forgejo Release ---
      - name: Upload binaries to Forgejo Release
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ gitea.server_url || github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          API_URL="${SERVER_URL}/api/v1"
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          RELEASE_ID="${{ github.event.release.id || '' }}"

          if [ -z "$RELEASE_ID" ]; then
            echo "Looking up Release ID for tag: ${TAG}..."
            RELEASE_ID=$(curl -sSL -H "Authorization: token ${FORGEJO_TOKEN}" \
              "${API_URL}/repos/${REPO}/releases/tags/${TAG}" | grep -o '"id":[0-9]*' | head -n 1 | cut -d: -f2 || true)
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "Release not found for tag ${TAG}. Skipping asset upload or creating release..."
            exit 0
          fi

          echo "Uploading release assets to Forgejo Release ID: ${RELEASE_ID}"

          # Fetch list of existing release assets to delete any duplicates before re-uploading
          EXISTING_ASSETS=$(curl -sSL -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${API_URL}/repos/${REPO}/releases/${RELEASE_ID}/assets" || echo "[]")

          for file in upload_staging/*; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            echo "----------------------------------------"
            echo "Preparing upload for: ${filename}"

            # Check if asset already exists
            ASSET_ID=$(echo "$EXISTING_ASSETS" | grep -B 2 "\"name\":\"${filename}\"" | grep -o '"id":[0-9]*' | head -n 1 | cut -d: -f2 || true)
            if [ -n "$ASSET_ID" ]; then
              echo "Asset ${filename} already exists (ID: ${ASSET_ID}). Deleting existing asset..."
              curl -sSL -X DELETE -H "Authorization: token ${FORGEJO_TOKEN}" \
                "${API_URL}/repos/${REPO}/releases/${RELEASE_ID}/assets/${ASSET_ID}" || true
            fi

            echo "Uploading ${filename}..."
            HTTP_CODE=$(curl -sSL -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${file}" \
              "${API_URL}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${filename}")

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Successfully uploaded ${filename} (HTTP ${HTTP_CODE})"
            else
              echo "Warning: Upload of ${filename} returned HTTP ${HTTP_CODE}"
            fi
          done
          echo "Completed release asset uploads for ${{ matrix.platform }}."
